services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: bigphotos-namenode
    environment:
      - CLUSTER_NAME=bigphotos
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_permissions_enabled=false
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode:/hadoop/dfs/name
    profiles: ["standalone"]

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: bigphotos-datanode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_permissions_enabled=false
    depends_on:
      - namenode
    volumes:
      - datanode:/hadoop/dfs/data
    profiles: ["standalone"]

  spark-master:
    user: root
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: bigphotos-spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - PYTHONPATH=/app
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "7077:7077"
    depends_on: []
    command: ["/opt/bitnami/scripts/spark/run.sh"]
    volumes:
      - .:/app
      - ./outputs:/app/outputs
      - ./data:/app/data
      - ./state:/app/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - old_hdfs_net

  spark-worker:
    user: root
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: bigphotos-spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - PYTHONPATH=/app
    env_file:
      - .env
    depends_on:
      - spark-master
    command: ["/opt/bitnami/scripts/spark/run.sh"]
    volumes:
      - .:/app
      - ./outputs:/app/outputs
      - ./data:/app/data
      - ./state:/app/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - old_hdfs_net

  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: bigphotos-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka:/bitnami/kafka

  ollama:
    image: ollama/ollama:latest
    container_name: bigphotos-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  ray-head:
    build:
      context: .
      dockerfile: Dockerfile.ray
    container_name: bigphotos-ray-head
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    ports:
      - "8266:8265"
      - "6380:6379"
      - "8002:8000"
    depends_on: []
    command: bash -lc "ray start --head --dashboard-host=0.0.0.0 --port=6379 --block"
    volumes:
      - .:/app
      - ./outputs:/app/outputs
      - ./data:/app/data
      - ../data:/app/shared_data:ro
      - ./state:/app/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - old_hdfs_net

  ray-worker:
    build:
      context: .
      dockerfile: Dockerfile.ray
    container_name: bigphotos-ray-worker
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      - ray-head
    command: bash -lc "ray start --address=ray-head:6379 --block"
    volumes:
      - .:/app
      - ./outputs:/app/outputs
      - ./data:/app/data
      - ./state:/app/state
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: bigphotos-backend
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      - kafka
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8001
    volumes:
      - .:/app
      - ./outputs:/app/outputs
      - ./data:/app/data
      - ../data:/app/shared_data:ro
      - ./state:/app/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - old_hdfs_net

  upload-consumer:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: bigphotos-upload-consumer
    env_file:
      - .env
    depends_on:
      - backend
      - kafka
      - ray-head
    command: python /app/consumer/upload_consumer.py
    volumes:
      - .:/app
      - ./outputs:/app/outputs
      - ./data:/app/data
      - ./state:/app/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - old_hdfs_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bigphotos-frontend
    environment:
      - VITE_API_BASE=http://localhost:8001
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  namenode:
  datanode:
  kafka:
  ollama:

networks:
  old_hdfs_net:
    external: true
    name: big-photos_default
